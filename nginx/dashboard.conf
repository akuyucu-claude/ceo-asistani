# CEO Asistanı — Nginx Dashboard Config
# 
# Her müşteri VM'inde /etc/nginx/sites-available/dashboard
# Hermes agent tarafından otomatik kurulur.

server {
    listen 80;
    server_name dashboard.SIRKET_DOMAIN;

    # HTTP → HTTPS yönlendirme (certbot sonrası)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dashboard.SIRKET_DOMAIN;

    # SSL (certbot ile otomatik)
    ssl_certificate     /etc/letsencrypt/live/dashboard.SIRKET_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.SIRKET_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Dashboard statik dosyaları
    root /var/www/dashboard;
    index index.html;

    # Güvenlik header'ları
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Sadece dashboard, başka hiçbir şey serve etme
    location / {
        try_files $uri $uri/ =404;
    }

    # API endpoint (ileride)
    location /api/ {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Log
    access_log /var/log/nginx/dashboard-access.log;
    error_log  /var/log/nginx/dashboard-error.log;
}
